<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Test</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Texturina:ital,opsz,wght@0,12..72,100..900;1,12..72,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Balthazar&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Della+Respira&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=GFS+Neohellenic:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Grenze:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="ui" id="interact">
      <p>
        <span id="tag-name"></span><br/>
        <span id="tag-description"></span>
      </p>
    </div>

    <div id="press-tip">
      <p>Press <strong>E</strong> to interact</p>
    </div>



    <div class="dialogue-box" id="dialogue-box-npc">
      <img class="portrait" src="/portraits/NPC.png" alt="NPC"/>
      <div class="infos">
        <div class="speaker-name dialogue-box sn-l" id="npc-name"></div>
        <div class="dialogue left" id="text-npc">
          <p id="line-npc"></p>
        </div>
      </div>
    </div>

    <div class="dialogue-box" id="dialogue-box-mc">
      <div class="infos i-r">
        <div class="speaker-name dialogue-box sn-r">The Explorer</div>
        <div class="dialogue right" id="text-mc">
          <p id="line-mc"></p>
        </div>
      </div>
      <img class="portrait" src="/portraits/MC.png" alt="MC"/>
    </div>

    <div class="description-box" id="description-box-place">
      <div class="infos i-r">
        <div class="speaker-name description-box sn-r" id="place-name"></div>
        <div class="dialogue right" id="text-place">
          <p id="line-place"></p>
        </div>
      </div>
      <img class="portrait" src="/portraits/PLACE.png" alt="Place"/>
    </div>

    <canvas class="webgl"></canvas>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/dialogue.js"></script>

  </body>
</html>
